<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Festival Budaya Austronesia - Merayakan Kekayaan Budaya dan Tradisi">
  <title>Festival Budaya Austronesia</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navbar -->
  <header>
    <div class="nav-container container">
      <div class="logo">Austronesia Fest</div>
      <nav>
        <ul class="nav-links">
          <li><a href="#home">Beranda</a></li>
          <li><a href="#schedule">Jadwal</a></li>
          <li><a href="#gallery">Galeri</a></li>
          <li><a href="#contact">Kontak</a></li>
        </ul>
      </nav>
      <div class="navbar-toggle">
        <span>&#9776;</span>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero" id="home">
    <div class="hero-content">
      <h1>Selamat Datang di Festival Budaya Austronesia</h1>
      <p>Merayakan Keindahan dan Kekayaan Budaya Austronesia</p>
      <a href="#schedule" class="btn">Lihat Jadwal</a>
    </div>
  </section>

  <!-- Jadwal -->
  <section class="page-section" id="schedule">
    <div class="container">
      <h2>Jadwal Acara</h2>
      <ul class="schedule">
        <!-- Event items will be dynamically added here -->
      </ul>
    </div>
  </section>

  <!-- Galeri -->
  <section class="page-section" id="gallery">
    <div class="container">
      <h2>Galeri</h2>
      <div class="gallery-grid">
        <img src="images/gallery-1.jpg" alt="Event 1">
        <img src="images/gallery-2.jpg" alt="Event 2">
        <img src="images/gallery-3.jpg" alt="Event 3">
      </div>
    </div>
  </section>

  <!-- Kontak -->
  <section class="page-section" id="contact">
    <div class="container">
      <h2>Kontak Kami</h2>
      <form class="contact-form">
        <input type="text" placeholder="Nama" required>
        <input type="email" placeholder="Email" required>
        <textarea placeholder="Pesan" required></textarea>
        <button type="submit">Kirim Pesan</button>
      </form>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <div class="footer-content">
      <p>&copy; 2025 Festival Budaya Austronesia</p>
      <div class="social-icons">
        <a href="#">Facebook</a>
        <a href="#">Instagram</a>
        <a href="#">Twitter</a>
      </div>
    </div>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
